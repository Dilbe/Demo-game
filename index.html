<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Demo Game</h1>

  <div id="health-bar">
    <div id="health-bar-fill"></div>
    <span id="health-bar-label">HP: <span id="player-hp">10</span> / <span id="player-max-hp">10</span></span>
    <div id="regen-progress"></div>
  </div>

  <nav id="tabs">
    <button class="tab-button" data-tab="fight-tab">Fight</button>
    <button class="tab-button" data-tab="character-tab">Character</button>
    <button class="tab-button" data-tab="skills-tab">Skills</button>
  </nav>

  <section id="fight-tab" class="tab-panel">
    <div id="monster-select"></div>

    <div id="monster-list"></div>

    <button id="start-button" disabled>Start</button>

    <div id="skill-bar" hidden></div>

    <p id="result-message" hidden></p>
    <button id="restart-button" hidden>Restart</button>
  </section>

  <section id="character-tab" class="tab-panel" hidden>
    <p>XP: <span id="xp-total">0</span></p>

    <div id="stat-list"></div>

    <button id="reset-character-button">Reset Character</button>
  </section>

  <section id="skills-tab" class="tab-panel" hidden>
    <p>XP: <span id="skills-xp-total">0</span> &middot; Slots: <span id="slots-used">0</span> / <span id="slots-total">2</span> &middot; Points: <span id="points-used">0</span> / <span id="points-total">3</span></p>
    <div id="skill-list"></div>
  </section>

  <script src="formulas.js"></script>
  <script src="game.js"></script>
</body>
</html>
